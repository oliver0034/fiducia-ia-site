name: Déploiement Hostinger

# ATTENTION (vérifié le 24/08/2026) : l'intégration Git native de hPanel pour
# fiducia-ia.com est branchée sur le dépôt mg-traiteur-ops (app cliente mg-ops),
# pas sur ce dépôt. Ne jamais compter dessus pour ce site, ni la reconfigurer.
# Ce workflow FTP est donc la voie de déploiement automatisée normale pour ce
# site (pas un simple filet de sécurité), avec en complément la voie manuelle
# via l'API Hostinger (hosting_generateUploadURLV1) documentée dans le skill
# fiducia-ia-blog-hebdo.
# Il se lance depuis l'onglet Actions ("Run workflow") ou via l'API, et
# nécessite 3 secrets dans Settings → Secrets and variables → Actions :
#   FTP_SERVER    : hôte FTP Hostinger (ex. ftp.fiducia-ia.com)
#   FTP_USERNAME  : compte FTP dont la racine est le public_html du domaine
#   FTP_PASSWORD  : mot de passe de ce compte FTP

on:
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Envoi des fichiers vers Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Déploiement FTP (synchronisation incrémentale)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
