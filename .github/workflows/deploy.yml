name: Déploiement Hostinger

# SOLUTION DE SECOURS. Non configurée à ce jour (aucun secret défini).
#
# ⚠️ Corrigé le 11/08/2026. L'en-tête précédent affirmait que le déploiement
# passait par « l'intégration Git native de Hostinger, webhook automatique sur
# push main ». C'est FAUX : vérification faite dans hPanel → fiducia-ia.com →
# Avancé → GIT, le seul dépôt connecté est mg-traiteur-ops (vers
# public_html/mg-ops), et Hostinger n'autorise qu'une connexion Git par site.
#
# ✅ LA VRAIE VOIE, celle qu'utilise la routine `fiducia-ia-blog-hebdo`
# (~/.claude/scheduled-tasks/fiducia-ia-blog-hebdo/SKILL.md, étape 4) :
# push sur GitHub, puis upload fichier par fichier via l'API du gestionnaire
# de fichiers hPanel — token de session dans l'URL + JWT depuis le
# localStorage, POST vers
# https://srv1425-files.hstgr.io/<token>/api/resources/public_html/<chemin>?override=true
# avec le contenu récupéré sur raw.githubusercontent.com.
# Aucun mot de passe, et surtout : chirurgical.
#
# ⚠️ public_html/ contient AUSSI mg-ops/ (MG Traiteur) et pilotage/.
# Tout déploiement en masse ou par archive les écraserait. Toujours procéder
# fichier par fichier.
#
# Lancement de ce workflow de secours : onglet Actions → Run workflow.
#
# Nécessite 3 secrets dans Settings → Secrets and variables → Actions :
#   FTP_SERVER    = ftp.fiducia-ia.com
#   FTP_USERNAME  = u434034366.fiducia-ia.com
#   FTP_PASSWORD  = mot de passe de ce compte FTP (hPanel → Fichiers →
#                   Comptes FTP → « Changer le mot de passe FTP »)
#
# ⚠️ server-dir : le compte u434034366.fiducia-ia.com atterrit dans
# /home/u434034366/domains/fiducia-ia.com/, PAS dans le public_html.
# hPanel l'indique : « Folder to upload files : public_html ».
# D'où server-dir: public_html/ — avec ./ les fichiers se déposeraient à côté
# du site, sans aucun effet visible.

on:
  workflow_dispatch:

concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Envoi des fichiers vers Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Déploiement FTP (synchronisation incrémentale)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/README.md
